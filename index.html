<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Project Nebral — Loading</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg">
    <div class="slideshow" id="slideshow"></div>
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>

  <audio id="bgMusic" autoplay loop>
    <source src="music.mp3" type="audio/mpeg" />
  </audio>

  <main class="ui">
    <header class="top">
      <div class="brand">
        <div class="tag">PROJECT</div>
        <div class="name">NEBRAL</div>
        <div class="sub">OPERAÇÃO • TEATRO DO IRAQUE</div>
      </div>

      <div class="status">
        <div class="dot"></div>
        <div class="txt">Conectando e baixando conteúdo…</div>
      </div>
    </header>

    <section class="card">
      <h1>Bem-vindo ao teatro de operações</h1>
      <p>
        Mantenha o RP fluido.
      </p>

      <div class="tips">
        <div class="tip">
          <span class="k">SETAS</span>
          <span class="t">Navegar entre imagens</span>
        </div>
        <div class="tip">
          <span class="k">F12</span>
          <span class="t">Captura/overlay (dependendo do setup do player)</span>
        </div>
      </div>

      <div class="loader">
        <div class="dot-loader">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
      <div class="small" id="smallText">Sincronizando assets…</div>
    </section>

    <footer class="bottom">
      <div class="ver">Project Nebral • Iraque</div>
    </footer>
  </main>

  <div class="toast" id="toast">Imagem alterada</div>

  <script src="app.js"></script>
</body>
</html>
